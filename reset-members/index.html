const SKETCH = `<filter id="sk"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="2.4"/></filter>`;
function plate(n){ return `<figure class="plate" aria-hidden="true"><svg class="ink draw" viewBox="0 0 200 200"><defs>${SKETCH}</defs><g filter="url(#sk)">${MOTIF[n-1]}</g></svg></figure>`; }

/* the seed that grows into a tree across 21 days, and the stars come out at the end */
function sprout(n){
  const g=[], B=182, X=80, f=v=>v.toFixed(1);
  g.push(`<path class="soft" d="M10 ${B}C50 ${B-3} 110 ${B+3} 150 ${B-1}"/>`);
  if(n<=7) g.push(`<ellipse cx="${X}" cy="${B+7}" rx="6" ry="4"${n>4?' class="soft"':''}/>`);
  if(n>=2){ const r=Math.min(1,(n-1)/12);
    g.push(`<path class="soft" d="M${X-2} ${B+8}C${X-8} ${B+12} ${f(X-14-20*r)} ${f(B+14+2*r)} ${f(X-18-26*r)} ${B+16}M${X+2} ${B+8}C${X+8} ${B+13} ${f(X+14+20*r)} ${f(B+14+2*r)} ${f(X+18+26*r)} ${B+16}M${X} ${B+10}V${f(B+12+4*r)}"/>`); }
  if(n<3) return wrap(g,n);
  const t=(n-3)/18, H=14+106*Math.pow(t,.85), top=B-H;
  // trunk
  if(n<7) g.push(`<path d="M${X} ${B+4}C${X-3} ${f(B-H*.4)} ${X+3} ${f(B-H*.7)} ${X} ${f(top)}"/>`);
  else { const w=1.5+(n-7)*0.45;
    g.push(`<path d="M${f(X-w)} ${B}C${f(X-w)} ${f(B-H*.45)} ${f(X-w*.4)} ${f(B-H*.8)} ${X} ${f(top)}"/>`);
    g.push(`<path d="M${f(X+w)} ${B}C${f(X+w)} ${f(B-H*.45)} ${f(X+w*.4)} ${f(B-H*.8)} ${X} ${f(top)}"/>`);
    g.push(`<path class="soft" d="M${f(X-w-4)} ${B}C${f(X-w)} ${B-3} ${f(X-w)} ${B-6} ${f(X-w)} ${B-8}M${f(X+w+4)} ${B}C${f(X+w)} ${B-3} ${f(X+w)} ${B-6} ${f(X+w)} ${B-8}"/>`); }
  // first leaves
  if(n<=8){ const s=Math.min(1,(n-2)/4);
    g.push(`<path d="M${X} ${f(top)}C${f(X-8*s)} ${f(top-2)} ${f(X-14*s)} ${f(top-8*s)} ${f(X-18*s)} ${f(top-14*s)}C${f(X-8*s)} ${f(top-14*s)} ${f(X-3*s)} ${f(top-7*s)} ${X} ${f(top)}"/>`);
    g.push(`<path d="M${X} ${f(top)}C${f(X+8*s)} ${f(top-2)} ${f(X+14*s)} ${f(top-8*s)} ${f(X+18*s)} ${f(top-14*s)}C${f(X+8*s)} ${f(top-14*s)} ${f(X+3*s)} ${f(top-7*s)} ${X} ${f(top)}"/>`); }
  // branches
  const BR=[[.42,-1,34,8],[.52,1,38,9],[.64,-1,30,10],[.72,1,30,11],[.82,-1,22,12],[.86,1,22,13]];
  BR.forEach(([p,d,L,from])=>{ if(n<from) return; const k=Math.min(1,(n-from+1)/5), len=L*k*(0.7+0.3*t);
    const y0=B-H*p, x1=X+d*len*.9, y1=y0-len*.6;
    g.push(`<path d="M${X} ${f(y0)}C${f(X+d*len*.35)} ${f(y0-2)} ${f(X+d*len*.65)} ${f(y0-len*.25)} ${f(x1)} ${f(y1)}"/>`);
    if(n<14) g.push(`<path d="M${f(x1)} ${f(y1)}c${d*6} -1 ${d*10} -5 ${d*12} -10c${d*-6} 0 ${d*-10} 4 ${d*-12} 10"/>`);
  });
  // canopy: a scalloped crown that fills out
  if(n>=14){ const rx=20+(n-14)*4.8, ry=rx*.78, cx=X, cy=top+ry*.3, N=10+Math.round((n-14)*.7);
    let d="", px=0, py=0; for(let i=0;i<=N;i++){ const th=(195-210*i/N)*Math.PI/180, th2=(195-210*(i-.5)/N)*Math.PI/180;
      const x=cx+Math.cos(th)*rx, y=cy-Math.sin(th)*ry, bx=cx+Math.cos(th2)*rx*1.15, by=cy-Math.sin(th2)*ry*1.15;
      d+= i===0?`M${f(x)} ${f(y)}`:`Q${f(bx)} ${f(by)} ${f(x)} ${f(y)}`; }
    // close the underside with a gentle line
    g.push(`<path d="${d}"/>`);
    g.push(`<path class="soft" d="M${f(cx-rx*.92)} ${f(cy+ry*.35)}C${f(cx-rx*.4)} ${f(cy+ry*.7)} ${f(cx+rx*.4)} ${f(cy+ry*.7)} ${f(cx+rx*.92)} ${f(cy+ry*.35)}"/>`);
    [[-.4,-.2],[.35,-.35],[0,.15],[-.15,-.55],[.5,.1]].slice(0,Math.min(5,n-13)).forEach(([a,b])=>g.push(`<path class="soft" d="M${f(cx+a*rx)} ${f(cy+b*ry)}q4 -3 8 0"/>`));
  }
  // night falls: stars come out
  const STARS=[[14,22,20],[150,64,20],[8,62,21],[56,8,21],[106,6,21],[152,104,21],[20,104,21]];
  STARS.forEach(([x,y,from])=>{ if(n<from) return;
    g.push(`<path d="M${x} ${y-5}V${y+5}M${x-5} ${y}H${x+5}"/><circle class="dot" cx="${x}" cy="${y}" r="1.4"/>`); });
  if(n===21) g.push(`<path d="M136 14A10 10 0 1 0 148 28A8 8 0 1 1 136 14"/>`);
  return wrap(g,n);
}
function wrap(g,n){ return `<div class="sprout-wrap" aria-label="Your tree, day ${n} of 21"><svg class="ink sprout" viewBox="0 0 160 200"><defs>${SKETCH}</defs><g filter="url(#sk)">${g.join("")}</g></svg><div>Day ${n} / 21</div></div>`; }

const $ = s=>document.querySelector(s);
let DONE_KEY="reset-done";
const store = { get(){try{return JSON.parse(localStorage.getItem(DONE_KEY)||"[]")}catch(e){return[]}}, set(v){try{localStorage.setItem(DONE_KEY,JSON.stringify(v))}catch(e){}} };
let done = store.get();
/* Days open on their own date. On the live site RUN_START comes from the buyer's booking;
   in this preview it is the 1st of this month and the preview bar sets which day it is. */
const kv={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const now=new Date();
let LIVE=false, RUN_START=new Date(now.getFullYear(),now.getMonth(),1);
let runDay = kv.get("reset-preview-day",5);
let openAll = kv.get("reset-open-all",false);
const unlocked = n => openAll || n<=runDay;
const fmtDate = d => d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
const opensOn = n => fmtDate(new Date(RUN_START.getFullYear(),RUN_START.getMonth(),RUN_START.getDate()+n-1));
const todayDay = () => Math.min(21,Math.max(1,runDay));

function blocks(arr){return (arr||[]).map(b=>{
  if(typeof b==="string") return `<p>${b}</p>`;
  if(b.h) return `<h3>${b.h}</h3>`;
  if(b.ul) return `<ul>${b.ul.map(i=>`<li>${i}</li>`).join("")}</ul>`;
  if(b.i) return `<p class="indent">${b.i}</p>`;
  if(b.p) return `<p class="indent" style="font-style:normal">${b.p}</p>`;
  return "";}).join("")}
const play = `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 1l13 7-13 7z"/></svg>`;
const enc = encodeURIComponent;


/* ---- audio players ---- */
const PAUSE=`<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2h3.5v12H3zM9.5 2H13v12H9.5z"/></svg>`;
const fmt=x=>isFinite(x)?`${Math.floor(x/60)}:${String(Math.floor(x%60)).padStart(2,"0")}`:"–";
function wireAudio(){
  document.querySelectorAll("figure.audio").forEach(f=>{
    const a=f.querySelector("audio"),b=f.querySelector(".ap-btn"),bar=f.querySelector(".ap-bar"),cur=f.querySelector(".ap-cur"),dur=f.querySelector(".ap-dur");
    const playIcon=b.innerHTML;
    a.addEventListener("loadedmetadata",()=>dur.textContent=fmt(a.duration));
    a.addEventListener("timeupdate",()=>{cur.textContent=fmt(a.currentTime);if(a.duration)bar.value=Math.round(a.currentTime/a.duration*1000)});
    a.addEventListener("ended",()=>{b.innerHTML=playIcon;b.classList.remove("on")});
    b.addEventListener("click",()=>{ if(a.paused){document.querySelectorAll("audio").forEach(o=>o!==a&&o.pause());a.play().catch(()=>{});b.innerHTML=PAUSE;b.classList.add("on");b.setAttribute("aria-label","Pause")}
      else{a.pause();b.innerHTML=playIcon;b.classList.remove("on");b.setAttribute("aria-label","Play")} });
    bar.addEventListener("input",()=>{if(a.duration)a.currentTime=bar.value/1000*a.duration});
  });
}
function render(n){
  const d = DAYS[n-1];
  [...document.querySelectorAll(".days button")].forEach((b,i)=>{b.setAttribute("aria-selected",i===n-1);b.classList.toggle("done",done.includes(i+1));b.classList.toggle("locked",!unlocked(i+1));b.classList.toggle("today",i+1===runDay&&runDay<=21)});
  $("#openAll").textContent = openAll ? "Follow the daily rhythm" : "Open all days";
  $("#openAll").setAttribute("aria-pressed",openAll);
  const sel=document.querySelector(`.days button[data-n="${n}"]`); sel&&sel.scrollIntoView({block:"nearest",inline:"center",behavior:"smooth"});
  $("#metaTitle").textContent = d.t ? `Day ${n} · ${d.t}` : `Day ${n}`;
  $("#metaProg").textContent = `${done.length} of 21 complete`;
  const nav = `<div class="pager"><button id="prev" ${n===1?"disabled":""}>← Day ${n-1}</button>
     <button class="go" id="next">${n===21?"Complete Reset":"Complete & continue →"}</button></div>`;
  if(!unlocked(n)){
    const before = runDay<1;
    $("#view").innerHTML = `<article><header class="day-head"><span class="num">${String(n).padStart(2,"0")}</span><div><p class="eyebrow">Day ${WORDS[n-1]}</p><h1>${d.t}</h1></div>${sprout(n)}</header>
      <div class="locked-panel">${before
        ? `<p class="lp-when">Your Reset begins on ${opensOn(1)}.</p>
           <p>Day 1 opens that morning, and each day after opens on its own date. Until then, a few things to have ready:</p>
           <ul class="lp-list"><li>A notebook. This will be your RESET journal.</li><li>A packet of seeds. Day 1 asks you to plant something.</li><li>Twenty minutes of your day that belong to Reset.</li></ul>
           <div class="lp-actions"><button class="go" id="lpOpen">Open all days now</button></div>`
        : `<p class="lp-when">This day opens on ${opensOn(n)}.</p>
           <p>Each day of Reset opens on its own date, so there is time to sit with what you have done so far. If you are in a flow and would like to go ahead, you can open every day now.</p>
           <div class="lp-actions"><button class="go" id="lpOpen">Open all days</button><button class="ghost" id="lpBack">Return to today, Day ${todayDay()}</button></div>`}</div></article>`;
    $("#lpOpen").onclick=()=>{openAll=true;kv.set("reset-open-all",true);render(n)};
    const lb=$("#lpBack"); if(lb) lb.onclick=()=>go(todayDay());
    return;
  }
  if(!d.t){
    $("#view").innerHTML = `<article><header class="day-head"><span class="num">${String(n).padStart(2,"0")}</span><div><p class="eyebrow">Day ${WORDS[n-1]}</p><h1>Coming soon</h1></div></header>
      <div class="placeholder"><p>This day’s text is still to be added.</p>Send the screenshots for Day ${n} and it will be copied in word for word.</div>${nav}</article>`;
  } else {
    const media = (d.media||[]).map(([t,k,v])=> v&&v.vimeo&&LIVE
      ? `<figure class="media video" style="margin:0"><div class="vframe"><iframe src="https://player.vimeo.com/video/${v.vimeo}?${v.h?"h="+v.h+"&":""}badge=0&autopause=0&dnt=1&title=0&byline=0&portrait=0" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media" referrerpolicy="strict-origin-when-cross-origin" title="${t}" loading="lazy"></iframe></div><figcaption class="cap">${t}<span>${k}</span></figcaption></figure>`
      : v&&v.vimeo
      ? `<figure class="media" style="margin:0"><a class="screen live" href="https://vimeo.com/${v.vimeo}${v.h?"/"+v.h:""}" target="_blank" rel="noopener" aria-label="Play ${t}" data-vimeo="${v.vimeo}" data-h="${v.h||""}"><span class="play">${play}</span></a><figcaption class="cap">${t}<span>${k}</span></figcaption></figure>`
      : v&&v.src
      ? `<figure class="media audio" style="margin:0"><audio preload="metadata" src="${v.src}"></audio>
          <div class="ap"><button class="ap-btn" aria-label="Play ${t}">${play}</button>
          <div class="ap-body"><div class="ap-t">${t}</div>
          <input class="ap-bar" type="range" min="0" max="1000" value="0" aria-label="Position in ${t}">
          <div class="ap-time"><span class="ap-cur">0:00</span><span class="ap-dur">–</span></div></div></div></figure>`
      : `<figure class="media" style="margin:0"><div class="screen"><span class="play">${play}</span></div><figcaption class="cap">${t}<span>${k} to add</span></figcaption></figure>`).join("");
    const notes = (d.notes||[]).map(x=>typeof x==="string"?`<div class="note">${x}</div>`:`<div class="note quote"><p>${x.q}</p></div>`).join("");
    const offers = d.offers?`<div class="offers"><h4>Additional Offers</h4>${d.offers.map(([h,ps])=>`<details><summary>${h}</summary>${ps.map(p=>`<p>${p}</p>`).join("")}</details>`).join("")}</div>`:"";
    const res = d.res?`<div class="res">${d.res.map(r=>Array.isArray(r)?`<a class="chip" href="${r[1]}" target="_blank" rel="noopener">${r[0]} →</a>`:`<span class="chip">${r}<i>link to add</i></span>`).join("")}</div>`:"";
    $("#view").innerHTML = `<article>
      <header class="day-head"><span class="num">${String(n).padStart(2,"0")}</span><div><p class="eyebrow">Day ${WORDS[n-1]}</p><h1>${d.t}</h1></div>${sprout(n)}</header>
      <div class="grid"><div class="main">
        <div class="contemplate"><div class="label">Contemplation for the day</div><p>${d.c}</p></div>
        ${d.pull?`<p class="pull">${d.pull}</p>`:""}
        ${blocks(d.body)}${res}
      </div><aside>${media}${notes}${offers}</aside></div>
      ${d.after?`<section class="after">${d.after}</section>`:""}
      <section class="accomp"><div class="txt"><h2>Accompaniment</h2>${blocks(d.acc)}</div>
        <div class="track"><div class="k">Day ${n} · Today’s track</div><div class="t">${d.track}</div>
        <div class="btns"><a href="https://open.spotify.com/search/${enc(d.track)}" target="_blank" rel="noopener">Spotify</a><a href="https://music.apple.com/gb/search?term=${enc(d.track)}" target="_blank" rel="noopener">Apple Music</a></div></div>
      </section>${nav}</article>`;
  }
  wireAudio();
  $("#prev").onclick=()=>go(n-1);
  $("#next").onclick=()=>{ if(!done.includes(n)){done.push(n);store.set(done)} n<21?go(n+1):render(n) };
}
function go(n){ document.querySelectorAll("audio").forEach(a=>a.pause()); location.hash = "day-"+n; window.scrollTo({top:0}); }
function current(){ const m=location.hash.match(/day-(\d+)/); let n=m?+m[1]:(runDay>21?(Array.from({length:21},(_,i)=>i+1).find(x=>!done.includes(x))||1):runDay); return Math.min(21,Math.max(1,n)); }

$("#days").innerHTML = DAYS.map((d,i)=>`<button role="tab" data-n="${i+1}" class="${d.t?"":"empty"}" title="${d.t?`Day ${i+1}: ${d.t.replace(/"/g,"")}`:`Day ${i+1}`}" aria-label="Day ${i+1}">${i+1}</button>`).join("");
$("#days").addEventListener("click",e=>{const b=e.target.closest("button");b&&go(+b.dataset.n)});
$("#openAll").addEventListener("click",()=>{openAll=!openAll;kv.set("reset-open-all",openAll);render(current())});
window.addEventListener("hashchange",()=>render(current()));

/* Live site: the signed-in buyer's own run. Preview (no server): a day picker. */
function startPreview(){
  const bar=$("#previewBar"); bar.hidden=false;
  const pv=$("#pvDay"); pv.innerHTML=Array.from({length:21},(_,i)=>`<option value="${i+1}">Day ${i+1}</option>`).join(""); pv.value=runDay;
  pv.addEventListener("change",()=>{runDay=+pv.value;kv.set("reset-preview-day",runDay);go(runDay);render(runDay)});
  render(current());
}
(async function boot(){
  let me=null;
  try{ const r=await fetch("/api/reset/me",{credentials:"same-origin",headers:{Accept:"application/json"}}); if(r.ok) me=await r.json(); }catch(e){}
  if(!me||!me.signedIn) return startPreview();
  LIVE=true;
  const [y,m,dd]=me.runStart.split("-").map(Number);
  RUN_START=new Date(y,m-1,dd);
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  runDay=Math.floor((today-RUN_START)/86400000)+1;
  openAll=kv.get("reset-open-all-"+me.runStart,false);
  DONE_KEY="reset-done-"+me.runStart; done=store.get();
  $("#openAll").onclick=null;
  const oa=$("#openAll").cloneNode(true); $("#openAll").replaceWith(oa);
  oa.addEventListener("click",()=>{openAll=!openAll;kv.set("reset-open-all-"+me.runStart,openAll);render(current())});
  $("#account").hidden=false; $("#accountEmail").textContent=me.email;
  $("#accessEnds").textContent=new Date(me.expires).toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
  if(new URLSearchParams(location.search).get("welcome")){
    const w=$("#welcome"); w.hidden=false;
    $("#welcomeText").textContent = runDay<1 ? `Your 21 days begin on ${opensOn(1)}. We've emailed you the details.` : `You're on Day ${todayDay()}. We've emailed you the details.`;
    history.replaceState(null,"",location.pathname+location.hash);
  }
  if(runDay<1 && !openAll && !location.hash) location.hash="day-1";
  render(current());
})();

/* ---- water ---- */
(function(){
  const cv=document.getElementById("water"); if(!cv||!cv.getContext) return;
  const ctx=cv.getContext("2d"); let W=0,H=0,t=0,ripples=[],last=0,raf=0;
  const still=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size(){const r=cv.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1);W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);}
  function frame(ts){
    t=ts/1000; ctx.clearRect(0,0,W,H);
    const rows=30, glint=W*0.74;
    for(let i=0;i<rows;i++){
      const p=i/(rows-1), y0=H*(0.12+0.88*Math.pow(p,1.6)), amp=0.6+p*2.6, k=0.012-p*0.006, sp=0.25+p*0.35;
      ctx.beginPath();
      for(let x=0;x<=W;x+=6){
        const y=y0+Math.sin(x*k+t*sp+i*1.7)*amp+Math.sin(x*k*2.3-t*sp*.7+i)*amp*.4;
        x?ctx.lineTo(x,y):ctx.moveTo(x,y);
      }
      const g=ctx.createLinearGradient(0,0,W,0), base=0.05+p*0.10, hi=base+0.22*(1-Math.abs(p-0.55));
      g.addColorStop(0,`rgba(214,196,160,${base*.5})`);g.addColorStop(Math.max(0,(glint-140)/W),`rgba(214,196,160,${base})`);
      g.addColorStop(glint/W,`rgba(236,222,192,${hi})`);g.addColorStop(Math.min(1,(glint+140)/W),`rgba(214,196,160,${base})`);g.addColorStop(1,`rgba(214,196,160,${base*.5})`);
      ctx.strokeStyle=g; ctx.lineWidth=0.8+p*0.6; ctx.stroke();
    }
    if(!still){
      if(ts-last>5200){last=ts;ripples.push({x:W*(0.15+Math.random()*0.7),y:H*(0.55+Math.random()*0.35),b:ts});}
      ripples=ripples.filter(r=>ts-r.b<6000);
      ripples.forEach(r=>{const a=(ts-r.b)/6000;for(let j=0;j<3;j++){const q=a-j*0.08;if(q<=0)continue;
        const rr=12+q*150;ctx.beginPath();ctx.ellipse(r.x,r.y,rr,rr*0.22,0,0,Math.PI*2);
        ctx.strokeStyle=`rgba(236,222,192,${(1-q)*0.32})`;ctx.lineWidth=1;ctx.stroke();}});
    }
  }
  function loop(ts){frame(ts);raf=requestAnimationFrame(loop);}
  size(); window.addEventListener("resize",()=>{size();if(still)frame(4000);});
  if(still){frame(4000);return;}
  raf=requestAnimationFrame(loop);
  document.addEventListener("visibilitychange",()=>{cancelAnimationFrame(raf);if(!document.hidden)raf=requestAnimationFrame(loop);});
})();
</script>
